name: Deploy Rugged Forged v4
on:
  push:
    paths:
      - '.github/workflows/deploy-rugged-forged-v4.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Preserve current live build
        run: |
          mkdir -p backups
          cp index.html backups/index-before-forged-v4-2026-08-27.html
      - name: Apply exact tested v4 patch
        run: git apply --check .github/forged-v4.patch && git apply .github/forged-v4.patch
      - name: Smoke test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          checks=['Rugged Handheld — Olive Drab','ruggedWoodland','ruggedDesert','ruggedUrban','ruggedNavy','ruggedPixelWood','ruggedPixelDesert','ruggedOcp','ruggedBlack','masterGain.gain.value=3.2','height:100dvh','overflow-y:hidden','function speak(text)']
          for x in checks:
              assert x in s,x
          assert 'unlockTimerAudio' not in s and 'playTimerCue' not in s
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          assert m
          Path('/tmp/check.js').write_text(m.group(1))
          PY
          node --check /tmp/check.js
      - name: Commit deployed build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html backups/index-before-forged-v4-2026-08-27.html
          git commit -m 'Deploy Rugged Forged v4 theme family'
          git push
