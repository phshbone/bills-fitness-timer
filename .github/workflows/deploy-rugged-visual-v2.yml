name: Deploy Rugged Handheld visual v2
on:
  push:
    paths:
      - '.github/workflows/deploy-rugged-visual-v2.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add Rugged Handheld theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'value="rugged">Rugged Handheld' in s:
              raise SystemExit('Rugged theme already present')
          s=s.replace('<optgroup label="Retro + Fantasy">','<optgroup label="Rugged + Field">\n          <option value="rugged">Rugged Handheld</option>\n        </optgroup>\n        <optgroup label="Retro + Fantasy">',1)
          anchor='    oldradio:{'
          if anchor not in s: raise SystemExit('Theme config anchor missing')
          s=s.replace(anchor,"    rugged:{accent:'#8da088',rgb:'141,160,136',light:'#b7c4b0',selected:'#06100b',themeColor:'#26362d'},\n"+anchor,1)
          old="const signatureThemes=['steampunk','artdeco','arcade','synthwave','atomic','oldradio'];"
          new="const signatureThemes=['steampunk','artdeco','arcade','synthwave','atomic','oldradio','rugged'];"
          if old not in s: raise SystemExit('Signature theme anchor missing')
          s=s.replace(old,new,1)
          css=r'''
    /* Rugged Handheld v2 — physical-device skin; app geometry remains unchanged. */
    body.theme-rugged{--rubber:#0d1110;--shell:#344a3d;--shell-deep:#26362d;--shell-hi:#526a5b;--hardware:#7c8b83;--display:#0a100d;--accent:#8da088;--green:#8da088;background:linear-gradient(90deg,rgba(0,0,0,.52) 0 8px,rgba(93,119,101,.18) 8px 17px,transparent 17px calc(100% - 17px),rgba(93,119,101,.18) calc(100% - 17px) calc(100% - 8px),rgba(0,0,0,.52) calc(100% - 8px)),radial-gradient(ellipse at 50% -8%,rgba(255,255,255,.09),transparent 42%),linear-gradient(155deg,#455d4d 0%,#33483b 42%,#24342b 100%);color:#eef4ef}
    body.theme-rugged::before,body.theme-rugged::after{content:"";position:fixed;top:0;bottom:0;width:18px;z-index:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.06),transparent 28%,rgba(0,0,0,.24) 76%),repeating-linear-gradient(0deg,#111714 0 7px,#26372d 7px 12px,#455b4c 12px 14px,#172019 14px 22px);box-shadow:inset 2px 0 2px rgba(255,255,255,.08),inset -4px 0 6px rgba(0,0,0,.62),0 0 8px rgba(0,0,0,.30)}
    body.theme-rugged::before{left:0;border-right:1px solid rgba(255,255,255,.08)}body.theme-rugged::after{right:0;border-left:1px solid rgba(255,255,255,.08)}
    body.theme-rugged .app{position:relative;z-index:1}body.theme-rugged .app::before,body.theme-rugged .app::after{content:"";position:fixed;top:max(11px,env(safe-area-inset-top));width:7px;height:7px;border-radius:50%;z-index:4;pointer-events:none;background:radial-gradient(circle at 38% 32%,#a9b3ad 0 10%,#59645e 18% 38%,#202723 43% 70%,#0a0d0b 75%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10),0 1px 2px #000}body.theme-rugged .app::before{left:25px}body.theme-rugged .app::after{right:25px}
    body.theme-rugged .brand,body.theme-rugged .mode-tabs,body.theme-rugged .panel,body.theme-rugged .stage{border-color:rgba(174,197,181,.22)}
    body.theme-rugged .stage{position:relative;border:2px solid #101813;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 18%),linear-gradient(180deg,#1c2921,#111a15);box-shadow:inset 0 0 0 2px rgba(123,151,132,.10),inset 0 -8px 16px rgba(0,0,0,.42),0 2px 0 #536a59,0 6px 0 #18231c,0 10px 18px rgba(0,0,0,.35);border-radius:18px}
    body.theme-rugged .stage::before{content:"FIELD TIMER";position:absolute;top:7px;left:50%;transform:translateX(-50%);font:700 8px/1 system-ui,sans-serif;letter-spacing:2.2px;color:rgba(211,224,215,.36);text-shadow:0 -1px 0 rgba(0,0,0,.7);pointer-events:none}
    body.theme-rugged .dial{border:5px solid #090d0b;background:radial-gradient(circle at 48% 38%,rgba(98,128,106,.10),transparent 43%),radial-gradient(circle,#101a14 0 58%,#080d0a 76%);box-shadow:inset 0 0 0 2px #26372d,inset 0 0 18px rgba(0,0,0,.72),inset 0 3px 3px rgba(255,255,255,.035),0 3px 0 #536a59,0 7px 0 #101713,0 11px 18px rgba(0,0,0,.42)}
    body.theme-rugged .steel-btn,body.theme-rugged .mode-tab{position:relative;border:1px solid #020403;background:radial-gradient(ellipse at 50% 15%,rgba(255,255,255,.075),transparent 38%),linear-gradient(180deg,#222825 0%,#111512 48%,#080b09 100%);color:#eef4ef;box-shadow:inset 0 1px 1px rgba(255,255,255,.08),inset 0 -5px 8px rgba(0,0,0,.72),0 1px 0 #53675a,0 5px 0 #050806,0 8px 12px rgba(0,0,0,.34);text-shadow:0 1px 1px #000;border-radius:12px}
    body.theme-rugged .steel-btn::after,body.theme-rugged .mode-tab::after{content:"";position:absolute;inset:3px 5px auto 5px;height:1px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
    body.theme-rugged .steel-btn:active,body.theme-rugged .mode-tab:active{transform:translateY(2px);box-shadow:inset 0 2px 5px rgba(0,0,0,.72),0 2px 0 #050706}
    body.theme-rugged .steel-btn.selected,body.theme-rugged .mode-tab.active{background:linear-gradient(180deg,#4f6657,#34493d 70%);color:#fff;border-color:#1c2c24;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -4px 8px rgba(0,0,0,.34),0 4px 0 #162019}
    body.theme-rugged .panel{border:1px solid #17251d;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(0,0,0,.12)),#273a2f;box-shadow:inset 0 1px 0 rgba(255,255,255,.055),inset 0 -4px 8px rgba(0,0,0,.18),0 4px 0 #152119,0 8px 13px rgba(0,0,0,.22);border-radius:16px}
    body.theme-rugged select,body.theme-rugged input{background:linear-gradient(#171c19,#090c0a);color:#eef4ef;border:1px solid #060907;box-shadow:inset 0 2px 5px rgba(0,0,0,.58),0 1px 0 rgba(113,139,121,.30);border-radius:12px}body.theme-rugged .time{color:#f4faf5;text-shadow:0 0 10px rgba(141,160,136,.22),0 2px 1px #000}body.theme-rugged .lead-indicator{color:#b7c4b0}body.theme-rugged .brand{color:#e8eee9;text-shadow:0 1px 0 #000;letter-spacing:.7px}
'''
          if '</style>' not in s: raise SystemExit('Style close missing')
          s=s.replace('</style>',css+'\n  </style>',1)
          p.write_text(s)
          PY
      - name: Validate JavaScript and locked features
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          checks=['value="rugged">Rugged Handheld','body.theme-rugged','masterGain.gain.value=3.2','const total=m*60+s','height:100dvh','overflow-y:hidden','function speak(text)']
          for x in checks:
              assert x in s,x
          assert 'unlockTimerAudio' not in s
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S);assert m
          Path('/tmp/check.js').write_text(m.group(1))
          PY
          node --check /tmp/check.js
      - name: Commit deployed build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Rugged Handheld signature theme'
          git push
