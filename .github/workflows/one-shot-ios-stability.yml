name: One-shot iOS stability repair

on:
  push:
    paths:
      - '.github/workflows/one-shot-ios-stability.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text()

          replacements = [
              (
                  '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">',
                  '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">'
              ),
              (
                  '    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); }',
                  '''    html,body {\n      margin:0;\n      min-height:100%;\n      width:100%;\n      background:var(--bg);\n      color:var(--text);\n      overflow-x:hidden;\n      overscroll-behavior:none;\n      -webkit-text-size-adjust:100%;\n      text-size-adjust:100%;\n    }'''
              ),
              (
                  '    button,input { font:inherit; }\n    button { touch-action:manipulation; }',
                  '    button,input,select { font:inherit; }\n    button,input,select { touch-action:manipulation; }'
              ),
              (
                  '    @media (max-height:740px) {',
                  '''    /* Only compress genuinely small phones. Do not key this layout to height alone:\n       iOS Safari changes viewport height as browser chrome appears/disappears. */\n    @media (max-width:390px) and (max-height:740px) {'''
              ),
              (
                  "  let state='ready', phase='work', currentRound=1, audioCtx=null, masterGain=null, compressor=null, wakeLock=null, lastShown=null, leadInEnabled=true, leadRemainingMs=0;",
                  "  let state='ready', phase='work', currentRound=1, audioCtx=null, masterGain=null, compressor=null, wakeLock=null, lastShown=null, leadInEnabled=true, leadRemainingMs=0;\n  let speechUtterance=null;"
              ),
              (
                  '''  function speak(text){\n    if($('#voiceToggle').checked&&'speechSynthesis'in window){\n      speechSynthesis.cancel();\n      const u=new SpeechSynthesisUtterance(text);u.rate=1;u.pitch=1;u.volume=1;\n      const voices=speechSynthesis.getVoices();\n      const preferred=voices.find(v=>/Samantha|Karen|Daniel|Alex/i.test(v.name))||voices.find(v=>v.lang?.startsWith('en'));\n      if(preferred)u.voice=preferred;\n      u.onend=()=>{ if($('#soundToggle').checked&&audioCtx?.state!=='running'){ try{audioCtx.resume().catch(()=>{});}catch(e){} } };\n      speechSynthesis.speak(u);\n    }\n  }''',
                  '''  function speak(text){\n    if($('#voiceToggle').checked&&'speechSynthesis'in window){\n      const synth=window.speechSynthesis;\n      if(synth.paused) synth.resume();\n      if(synth.speaking||synth.pending) synth.cancel();\n      const u=new SpeechSynthesisUtterance(text);u.rate=1;u.pitch=1;u.volume=1;\n      speechUtterance=u; // Keep a live reference; iOS can otherwise drop an utterance.\n      const voices=synth.getVoices();\n      const preferred=voices.find(v=>/Samantha|Karen|Daniel|Alex/i.test(v.name))||voices.find(v=>v.lang?.startsWith('en'));\n      if(preferred)u.voice=preferred;\n      const afterSpeech=()=>{\n        if(speechUtterance===u) speechUtterance=null;\n        if($('#soundToggle').checked&&audioCtx?.state!=='running'){\n          try{audioCtx?.resume()?.catch?.(()=>{});}catch(e){}\n        }\n      };\n      u.onend=afterSpeech;\n      u.onerror=afterSpeech;\n      synth.speak(u);\n    }\n  }'''
              ),
              (
                  '''  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){activateAudio();if(state==='running'){tick();requestWake();}}});\n  $('#soundToggle').addEventListener('change',e=>{if(e.target.checked)activateAudio();});''',
                  '''  function rearmMedia(){\n    activateAudio();\n    if('speechSynthesis'in window&&speechSynthesis.paused){\n      try{speechSynthesis.resume();}catch(e){}\n    }\n  }\n  /* Any real user touch is another chance to satisfy iOS's audio-gesture rule. */\n  document.addEventListener('pointerdown',rearmMedia,{capture:true,passive:true});\n  window.addEventListener('pageshow',rearmMedia);\n  window.addEventListener('focus',rearmMedia);\n  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){rearmMedia();if(state==='running'){tick();requestWake();}}});\n  $('#soundToggle').addEventListener('change',e=>{if(e.target.checked)activateAudio();});\n  $('#voiceToggle').addEventListener('change',e=>{\n    if(e.target.checked&&'speechSynthesis'in window){\n      try{speechSynthesis.getVoices(); if(speechSynthesis.paused)speechSynthesis.resume();}catch(err){}\n    }else if(!e.target.checked&&'speechSynthesis'in window){\n      try{speechSynthesis.cancel();}catch(err){}\n      speechUtterance=null;\n    }\n  });'''
              ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              s = s.replace(old, new, 1)

          path.write_text(s)
          PY
      - name: Verify intended edits
        shell: bash
        run: |
          grep -q 'maximum-scale=1, user-scalable=no' index.html
          grep -q 'overscroll-behavior:none' index.html
          grep -q '@media (max-width:390px) and (max-height:740px)' index.html
          grep -q 'let speechUtterance=null;' index.html
          grep -q 'function rearmMedia()' index.html
          git diff --check
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/one-shot-ios-stability.yml
          git commit -m 'fix: stabilize iOS zoom layout and audio'
          git push
