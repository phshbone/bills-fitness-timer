name: Deploy Rugged Handheld v2 fixed
on:
  push:
    paths:
      - '.github/workflows/deploy-rugged-v2-fixed.yml'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested rugged theme patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/rugged_patch.py
          python3 /tmp/rugged_patch.py
      - name: Validate JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          assert m
          Path('/tmp/check.js').write_text(m.group(1))
          PY
          node --check /tmp/check.js
      - name: Commit rugged theme
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add Rugged Handheld signature theme v2'
          git push
# trigger corrected deployment
