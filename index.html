    :root {
      --bg:#090b0e; --panel:#171b21; --panel2:#20262e; --edge:#4b5561;
      --text:#f4f7fa; --muted:#9aa4ae; --green:#7f9982; --green-light:#aebcaf; --green-dark:#586f5b;
      --accent-rgb:127,153,130; --accent-contrast:#101511;
      --silver:#c7ced3; --amber:#b8955d; --red:#a85f62; --rest:#71858b; --shadow:rgba(0,0,0,.55);
      --progress:0deg; --accent:var(--green); --accent-light:var(--green-light); --accent-dark:var(--green-dark);
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); }
    body {
      min-height:100svh; overflow-x:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      padding:calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 50% -10%, rgba(var(--accent-rgb),.16), transparent 38%),
        repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 1px, transparent 1px 6px),
        linear-gradient(180deg,#11151a,#080a0c 75%);
    }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.28;
      background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
      background-size:22px 22px; }
    button,input { font:inherit; }
    button { touch-action:manipulation; }
    .app { width:min(100%,520px); margin:auto; }
    .brand { display:flex; align-items:flex-end; justify-content:space-between; margin:0 4px 12px; }
    .logo { font-family:Bauhaus,"Arial Black",sans-serif; font-size:clamp(30px,8vw,43px); line-height:.9; letter-spacing:-1px; text-transform:lowercase; color:var(--accent-light); text-shadow:0 2px 0 rgba(0,0,0,.65),1px 0 0 rgba(255,255,255,.14),0 0 14px rgba(199,206,211,.18); }
    .logo span { color:#f3f5f3; text-shadow:0 2px 0 rgba(0,0,0,.72),1px 0 0 rgba(255,255,255,.18),0 0 12px rgba(199,206,211,.16); }
    .tag { color:var(--muted); font-size:11px; letter-spacing:2px; text-transform:uppercase; padding-bottom:3px; }
    .mode-tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:6px; border:1px solid #343c46; border-radius:16px; background:#0e1115; box-shadow:inset 0 0 0 1px #050607,0 8px 24px var(--shadow); }
    .mode-tab { border:0; border-radius:11px; padding:11px; color:#8e99a5; background:transparent; font-weight:800; letter-spacing:.7px; }
    .mode-tab.active { color:var(--accent-contrast); border:1px solid var(--accent-light); background:linear-gradient(180deg,var(--accent-light),var(--accent-dark)); box-shadow:0 2px 0 #313a33,0 0 0 1px rgba(199,206,211,.24),0 0 16px rgba(199,206,211,.12),inset 0 1px rgba(255,255,255,.35); }
    .stage { position:relative; margin:14px 0; padding:18px; border-radius:28px; border:1px solid #45505b;

<body>
  <main class="app" id="app">
    <header class="brand"><div class="logo">bill's <span>timer</span></div><div class="tag">fitness timer</div></header>
    <nav class="mode-tabs" aria-label="Timer mode">
      <button class="mode-tab active" data-mode="quick">Quick Timer</button>
      <button class="mode-tab" data-mode="interval">Intervals</button>
    </nav>

    <section class="stage" aria-live="polite">
      <div class="phase" id="phaseLabel">QUICK TIMER</div>
      <div class="dial" id="dial"><div class="dial-inner"><div><div class="time" id="timerDisplay">0:40</div><div class="status" id="timerStatus">ready</div></div></div></div>
      <div class="round-strip" id="roundStrip"><span class="line"></span><strong id="roundLabel">ROUND 1 OF 5</strong><span class="line"></span></div>
    </section>

    <section class="panel quick-panel" id="quickPanel">
      <h2 class="panel-title">Quick Select</h2>
      <div class="preset-grid">
        <button class="steel-btn" data-seconds="15">15</button><button class="steel-btn" data-seconds="30">30</button>
        <button class="steel-btn selected" data-seconds="45">45</button><button class="steel-btn" data-seconds="60">1:00</button>
      </div>
      <div class="adjust-row"><button class="steel-btn" id="minusBtn">−5</button><button class="steel-btn" id="restartBtn">Restart Time</button><button class="steel-btn" id="plusBtn">+5</button></div>
      <div class="custom-row"><button class="steel-btn compact-label selected" id="leadInBtn" aria-pressed="true">5 second<br>lead in</button><input class="custom-input" id="customInput" type="number" inputmode="numeric" min="1" max="3600" placeholder="custom time"><button class="steel-btn" id="customSetBtn">Set</button></div>
    </section>

    <section class="panel interval-panel" id="intervalPanel">
      <h2 class="panel-title">Interval Setup</h2>
      <div class="settings-grid">
        <div class="setting"><label>Work</label><div class="stepper"><button data-step="work" data-delta="-5">−</button><output id="workValue">40</output><button data-step="work" data-delta="5">+</button></div></div>
        <div class="setting"><label>Rest</label><div class="stepper"><button data-step="rest" data-delta="-5">−</button><output id="restValue">20</output><button data-step="rest" data-delta="5">+</button></div></div>
        <div class="setting"><label>Rounds</label><div class="stepper"><button data-step="rounds" data-delta="-1">−</button><output id="roundsValue">5</output><button data-step="rounds" data-delta="1">+</button></div></div>
      </div>
    </section>

    <div class="main-controls">
      <button class="main-btn" id="resetBtn">Reset</button><button class="main-btn primary" id="startBtn">Start</button><button class="main-btn" id="skipBtn">Skip</button>
    </div>
    <div class="options"><label class="toggle"><input id="soundToggle" type="checkbox" checked> Sound</label><label class="toggle"><input id="voiceToggle" type="checkbox"> Voice cues</label></div>
    <div class="theme-bar"><span class="theme-label">Theme</span><select id="themeSelect" class="theme-select" aria-label="Choose app theme"><option value="green">Dusty Green</option><option value="blue">Dusty Blue</option><option value="pink">Dusty Pink</option><option value="red">Dusty Red</option><option value="silver">Silver Slate</option></select></div>
  </main>

<script>
(() => {
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const app=$('#app'), display=$('#timerDisplay'), status=$('#timerStatus'), phaseLabel=$('#phaseLabel'), dial=$('#dial');
  const startBtn=$('#startBtn'), resetBtn=$('#resetBtn'), skipBtn=$('#skipBtn'), roundStrip=$('#roundStrip'), roundLabel=$('#roundLabel');
  const quickPanel=$('#quickPanel'), intervalPanel=$('#intervalPanel'), themeSelect=$('#themeSelect');
  const themeColorMeta=document.querySelector('meta[name="theme-color"]');
  const values={work:40,rest:20,rounds:5};
  const themes={
    green:{accent:'#7f9982',light:'#aebcaf',dark:'#708973',rgb:'127,153,130',themeColor:'#111419'},
    blue:{accent:'#7f97ad',light:'#b5c3d0',dark:'#657d92',rgb:'127,151,173',themeColor:'#10151b'},
    pink:{accent:'#b0899f',light:'#d4bdca',dark:'#946f84',rgb:'176,137,159',themeColor:'#171217'},
    red:{accent:'#a56f72',light:'#c7a0a2',dark:'#88585c',rgb:'165,111,114',themeColor:'#171112'},
    silver:{accent:'#9baab5',light:'#d1d8de',dark:'#7c8c96',rgb:'155,170,181',themeColor:'#11151a'}
  };
  let mode='quick', selectedSeconds=45, remainingMs=45000, durationMs=45000, targetTime=0, ticker=null;
  let state='ready', phase='work', currentRound=1, audioCtx=null, masterGain=null, compressor=null, wakeLock=null, lastShown=null, leadInEnabled=true, leadRemainingMs=0;

  const format = ms => { const s=Math.max(0,Math.ceil(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };
  function unlockAudio(){
    try {
      audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
      if(!compressor){
        compressor=audioCtx.createDynamicsCompressor();
        compressor.threshold.value=-22; compressor.knee.value=16; compressor.ratio.value=8; compressor.attack.value=.002; compressor.release.value=.22;
        masterGain=audioCtx.createGain(); masterGain.gain.value=1;
        compressor.connect(masterGain); masterGain.connect(audioCtx.destination);
      }
      if(audioCtx.state==='suspended') audioCtx.resume();
    } catch(e){}
  }
  function tone(freq=700,duration=.12,volume=.18,delay=0,type='sine'){
    if(!$('#soundToggle').checked||!audioCtx||!compressor)return;
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;
    o.type=type;o.connect(g);g.connect(compressor);o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(Math.max(.001,volume),t);g.gain.exponentialRampToValueAtTime(.001,t+duration);
    o.start(t);o.stop(t+duration+.02);
  }
  function startDing(){
    tone(1046,.34,.72,0,'sine'); tone(1568,.38,.48,0,'triangle'); tone(2093,.28,.28,.01,'sine');
  }
  function boxingBell(){
    if(!$('#soundToggle').checked||!audioCtx)return;
    [0,.46,.92].forEach((d,i)=>{
      tone(860,.55,.92,d,'square'); tone(1290,.72,.78,d,'triangle'); tone(1720,.88,.48,d+.01,'sine'); tone(2580,.42,.28,d+.015,'sine');
      tone(205,.24,.52,d,'square');
    });
  }
  function speak(text){ if($('#voiceToggle').checked&&'speechSynthesis'in window){ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);u.rate=1.05;u.volume=.9;speechSynthesis.speak(u); } }
  function applyTheme(name){
    const theme=themes[name]||themes.green;
    const root=document.documentElement;
    root.style.setProperty('--green',theme.accent);
    root.style.setProperty('--green-light',theme.light);
    root.style.setProperty('--green-dark',theme.dark);
    root.style.setProperty('--accent',theme.accent);
    root.style.setProperty('--accent-light',theme.light);
    root.style.setProperty('--accent-dark',theme.dark);
    root.style.setProperty('--accent-rgb',theme.rgb);
    themeColorMeta?.setAttribute('content', theme.themeColor);
    if(themeSelect) themeSelect.value=name;
    try{ localStorage.setItem('billsTimerTheme',name); }catch(e){}
  }
  async function requestWake(){ try { if('wakeLock'in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){} }
  function releaseWake(){ try{wakeLock?.release();}catch(e){} wakeLock=null; }

  function setVisualClass(){ app.classList.toggle('warning',state==='running'&&remainingMs<=10000);app.classList.toggle('resting',mode==='interval'&&phase==='rest'&&state!=='finished');app.classList.toggle('finished',state==='finished'); }
  function render(){
    const shownMs=state==='lead-in'?leadRemainingMs:remainingMs;
    display.textContent=format(shownMs);
    const pct=state==='lead-in'?Math.max(0,Math.min(1,1-leadRemainingMs/5000)):(durationMs?Math.max(0,Math.min(1,1-remainingMs/durationMs)):0);
    document.documentElement.style.setProperty('--progress',`${pct*360}deg`);
    status.textContent=state==='lead-in'?'get ready':state==='running'?'running':state==='paused'?'paused':state==='finished'?'complete':'ready';
    phaseLabel.textContent=state==='lead-in'?'GET READY':mode==='quick'?'QUICK TIMER':state==='finished'?'WORKOUT COMPLETE':phase.toUpperCase();
    roundLabel.textContent=`ROUND ${currentRound} OF ${values.rounds}`;
    startBtn.textContent=state==='lead-in'?'Cancel':state==='running'?'Pause':state==='paused'?'Resume':state==='finished'?'Again':'Start';
    skipBtn.disabled=mode==='quick'||state==='ready'||state==='finished';
    setVisualClass();
  }
  function setQuick(seconds){ stopTicker(); selectedSeconds=Math.max(5,Math.min(3600,seconds));remainingMs=durationMs=selectedSeconds*1000;state='ready'; $$('.preset-grid .steel-btn').forEach(b=>b.classList.toggle('selected',+b.dataset.seconds===selectedSeconds));render(); }
  function setPhase(next, announce=true){ phase=next; durationMs=remainingMs=(phase==='work'?values.work:values.rest)*1000; lastShown=null; if(announce){ tone(phase==='work'?880:520,.18,.2);speak(phase==='work'?`Work. Round ${currentRound}`:'Rest'); } render(); }
  function tick(){
    if(state==='lead-in'){
      leadRemainingMs=Math.max(0,targetTime-Date.now());
      const shown=Math.ceil(leadRemainingMs/1000);
      if(shown!==lastShown){
        lastShown=shown;
        if(shown>0&&shown<=3){ tone(690+shown*55,.18,.54); tone(1030+shown*45,.13,.24,.015); }
      }
      render();
      if(leadRemainingMs<=0){
        clearInterval(ticker); ticker=null; startDing(); speak('Go');
        state='running'; lastShown=null; targetTime=Date.now()+remainingMs; ticker=setInterval(tick,100); render();
      }
      return;
    }
    remainingMs=Math.max(0,targetTime-Date.now()); const shown=Math.ceil(remainingMs/1000);
    if(shown!==lastShown){ lastShown=shown; if(shown>0&&shown<=5){ tone(610+shown*55,.16,.46); tone(915+shown*45,.12,.22,.015); } }
    render(); if(remainingMs<=0) completePhase();
  }
  function startTicker(withLead=false){
    clearInterval(ticker); lastShown=null;
    if(withLead){ state='lead-in'; leadRemainingMs=5000; targetTime=Date.now()+5000; }
    else { state='running'; targetTime=Date.now()+remainingMs; }
    ticker=setInterval(tick,100);tick();requestWake();
  }
  function stopTicker(){ clearInterval(ticker);ticker=null;releaseWake(); }
  function start(){
    unlockAudio();app.classList.remove('finished');
    if(state==='finished') reset();
    if(remainingMs<=0) reset();
    startTicker(leadInEnabled&&state==='ready'); render();
  }
  function cancelLead(){ stopTicker(); leadRemainingMs=0; state='ready'; lastShown=null; render(); }
  function pause(){ remainingMs=Math.max(0,targetTime-Date.now());stopTicker();state='paused';render(); }
  function completePhase(){ stopTicker(); if(mode==='quick'){ finish();return; } if(phase==='work'&&values.rest>0){ setPhase('rest');state='running';startTicker();return; } if(phase==='rest'||values.rest===0){ if(currentRound<values.rounds){currentRound++;setPhase('work');state='running';startTicker();}else finish(); } }
  function finish(){ remainingMs=0;state='finished';boxingBell();speak('Workout complete');if(navigator.vibrate)navigator.vibrate([220,90,220,90,420]);render();setTimeout(()=>app.classList.remove('finished'),3600); }
  function reset(){ stopTicker();state='ready';currentRound=1;phase='work'; if(mode==='quick'){remainingMs=durationMs=selectedSeconds*1000;}else{remainingMs=durationMs=values.work*1000;} leadRemainingMs=0;lastShown=null;render(); }
  function skip(){ if(mode==='interval'&&state!=='ready'&&state!=='finished'){remainingMs=0;completePhase();} }

  startBtn.onclick=()=>state==='lead-in'?cancelLead():state==='running'?pause():start(); resetBtn.onclick=reset; skipBtn.onclick=skip;
  $$('.mode-tab').forEach(b=>b.onclick=()=>{ mode=b.dataset.mode; $$('.mode-tab').forEach(x=>x.classList.toggle('active',x===b));quickPanel.style.display=mode==='quick'?'block':'none';intervalPanel.classList.toggle('show',mode==='interval');roundStrip.classList.toggle('show',mode==='interval');reset(); });
  $$('.preset-grid .steel-btn').forEach(b=>b.onclick=()=>setQuick(+b.dataset.seconds));
  $('#plusBtn').onclick=()=>{selectedSeconds=Math.min(3600,Math.ceil(remainingMs/1000)+5);remainingMs+=5000;durationMs=Math.max(durationMs,remainingMs);render();};
  $('#minusBtn').onclick=()=>{remainingMs=Math.max(5000,remainingMs-5000);selectedSeconds=Math.ceil(remainingMs/1000);durationMs=Math.max(remainingMs,selectedSeconds*1000);render();};
  $('#restartBtn').onclick=()=>setQuick(selectedSeconds);
  function customSet(){const n=+$('#customInput').value;if(n>=1&&n<=3600){setQuick(n);$('#customInput').value='';}}
  $('#customSetBtn').onclick=customSet;$('#customInput').addEventListener('keydown',e=>{if(e.key==='Enter')customSet();});
  $('#leadInBtn').onclick=()=>{leadInEnabled=!leadInEnabled;$('#leadInBtn').classList.toggle('selected',leadInEnabled);$('#leadInBtn').setAttribute('aria-pressed',String(leadInEnabled));};
  $$('[data-step]').forEach(b=>b.onclick=()=>{const k=b.dataset.step,d=+b.dataset.delta;values[k]=Math.max(k==='rounds'?1:k==='rest'?0:5,Math.min(k==='rounds'?50:3600,values[k]+d));$(`#${k}Value`).textContent=values[k];if(state==='ready')reset();});
  themeSelect?.addEventListener('change',e=>applyTheme(e.target.value));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state==='running'){tick();requestWake();}});
  try{ applyTheme(localStorage.getItem('billsTimerTheme')||'green'); }catch(e){ applyTheme('green'); }
  render();
})();
</script>
</body>
</html>
