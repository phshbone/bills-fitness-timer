    :root {
      --bg:#090b0e; --panel:#171b21; --panel2:#20262e; --edge:#4b5561;
      --text:#f4f7fa; --muted:#9aa4ae; --green:#7f9982; --green-light:#aebcaf; --green-dark:#586f5b;
      --accent-rgb:127,153,130; --selected-text:#101511; --accent-light:var(--green-light); --accent-dark:var(--green-dark);
      --silver:#c7ced3; --amber:#b8955d; --red:#a85f62; --rest:#71858b; --shadow:rgba(0,0,0,.55);
      --progress:0deg; --accent:var(--green);
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body {
      margin:0;
      min-height:100%;
      width:100%;
      background:var(--bg);
      color:var(--text);
      overflow-x:hidden;
      overscroll-behavior:none;
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
      touch-action:manipulation;
    }
    body {
      min-height:100svh; overflow-x:hidden; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      padding:calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));
      background:
        radial-gradient(circle at 50% -10%, rgba(127,153,130,.16), transparent 38%),
        repeating-linear-gradient(135deg, rgba(255,255,255,.018) 0 1px, transparent 1px 6px),
        linear-gradient(180deg,#11151a,#080a0c 75%);
    }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.28;
      background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
      background-size:22px 22px; }
    button,input,select { font:inherit; }
    button,input,select { touch-action:manipulation; }
    .app { width:min(100%,520px); margin:auto; }
    .brand { display:flex; align-items:flex-end; justify-content:space-between; margin:0 4px 12px; }
    .logo { font-family:Bauhaus,"Arial Black",sans-serif; font-size:clamp(30px,8vw,43px); line-height:.9; letter-spacing:-1px; text-transform:lowercase; color:var(--green-light); text-shadow:0 2px 0 rgba(0,0,0,.65),1px 0 0 rgba(255,255,255,.14),0 0 14px rgba(199,206,211,.18); }
    .logo span { color:#f3f5f3; text-shadow:0 2px 0 rgba(0,0,0,.72),1px 0 0 rgba(255,255,255,.18),0 0 12px rgba(199,206,211,.16); }
    .tag { color:var(--muted); font-size:11px; letter-spacing:2px; text-transform:uppercase; padding-bottom:3px; }
    .mode-tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:6px; border:1px solid #343c46; border-radius:16px; background:#0e1115; box-shadow:inset 0 0 0 1px #050607,0 8px 24px var(--shadow); }
    .mode-tab { border:0; border-radius:11px; padding:11px; color:#8e99a5; background:transparent; font-weight:800; letter-spacing:.7px; }

    .stage { position:relative; margin:14px 0; padding:18px; border-radius:28px; border:1px solid #45505b;
      background:linear-gradient(145deg,#262d35,#11151a 55%,#0d1014); box-shadow:inset 0 1px rgba(255,255,255,.08),inset 0 -20px 45px rgba(0,0,0,.28),0 18px 42px var(--shadow); overflow:hidden; }
    .stage::before { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(115deg,rgba(255,255,255,.09),transparent 24% 76%,rgba(255,255,255,.025)); }
    .phase { position:relative; z-index:2; text-align:center; color:var(--accent); font-size:13px; font-weight:900; letter-spacing:3px; text-transform:uppercase; min-height:18px; }
    .dial { --size:min(72vw,330px); width:var(--size); aspect-ratio:1; margin:7px auto 4px; border-radius:50%; padding:12px;
      background:conic-gradient(var(--accent) var(--progress),#303842 0); box-shadow:0 0 0 2px rgba(199,206,211,.24),0 5px 0 rgba(70,78,74,.78),0 0 20px rgba(199,206,211,.10),inset 0 0 18px #000; transition:background .18s linear; }
    .dial-inner { width:100%; height:100%; border-radius:50%; display:grid; place-items:center; position:relative;
      background:radial-gradient(circle at 50% 35%,#242b33,#0b0e12 72%); border:2px solid #0a0c0f; box-shadow:inset 0 0 42px #000,0 0 0 2px #515b66; }
    .dial-inner::after { content:""; position:absolute; inset:0; border-radius:50%; pointer-events:none; opacity:0; background:radial-gradient(circle,rgba(var(--theme-accent-rgb),.42) 0%,rgba(var(--theme-accent-rgb),.18) 46%,transparent 74%); box-shadow:inset 0 0 42px rgba(var(--theme-accent-rgb),.48),0 0 26px rgba(var(--theme-accent-rgb),.24); }
    .dial-inner.countdown-flash::after { animation:countdownPulse .42s ease-out; }
    .finished .dial-inner::after { opacity:1; background:radial-gradient(circle,rgba(210,82,88,.48) 0%,rgba(168,95,98,.20) 48%,transparent 76%); box-shadow:inset 0 0 46px rgba(210,82,88,.52),0 0 30px rgba(168,95,98,.30); animation:finishInnerPulse .7s ease-in-out 4; }
    .time { font-family:Bauhaus,"Arial Black",sans-serif; font-variant-numeric:tabular-nums; font-size:clamp(64px,19vw,104px); letter-spacing:-4px; line-height:.9; color:#f3f5f3; text-shadow:0 5px 18px #000,2px 2px 0 rgba(70,80,73,.95),-1px -1px 0 rgba(199,206,211,.32),0 0 13px rgba(199,206,211,.10); }
    .status { margin-top:8px; color:var(--muted); font-size:12px; letter-spacing:2px; text-transform:uppercase; text-align:center; }
    .lead-indicator { display:none; margin-top:7px; color:var(--accent-light); font-size:15px; font-weight:900; letter-spacing:1.5px; text-align:center; }
    .lead-indicator.show { display:block; }
    .round-strip { display:none; position:relative; z-index:2; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; margin-top:6px; color:#bdc6ce; font-size:13px; }
    .round-strip.show { display:grid; }
    .round-strip .line { height:1px; background:linear-gradient(90deg,transparent,#505a65); }
    .round-strip .line:last-child { transform:scaleX(-1); }
    .panel { margin-bottom:12px; padding:14px; border:1px solid #343d47; border-radius:18px; background:linear-gradient(145deg,rgba(35,41,49,.94),rgba(15,18,23,.96)); box-shadow:inset 0 1px rgba(255,255,255,.05),0 10px 24px rgba(0,0,0,.3); }
    .panel-title { margin:0 0 10px; color:#aab4bd; font-size:11px; font-weight:900; letter-spacing:2px; text-transform:uppercase; }
    .preset-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:9px 16px; padding:0 10px; }
    .steel-btn { position:relative; border:1px solid #4b5661; border-radius:999px; min-height:42px; color:#e7edf2; font-weight:800; background:linear-gradient(180deg,#303843,#252a31); box-shadow:inset 0 1px rgba(255,255,255,.12),inset 0 -3px 7px rgba(0,0,0,.18),0 3px 7px rgba(0,0,0,.28); }
    .steel-btn:active { transform:translateY(1px); filter:brightness(1.12); }
    .steel-btn.selected { color:var(--selected-text); border-color:var(--accent-light); background:linear-gradient(180deg,var(--accent-light),var(--accent-dark)); box-shadow:0 2px 0 #313a33,0 0 0 1px rgba(199,206,211,.22),0 0 14px rgba(199,206,211,.10),inset 0 1px rgba(255,255,255,.34); }
    .adjust-row { display:grid; grid-template-columns:1fr 1.65fr 1fr; gap:14px; margin-top:10px; }
    .adjust-row .steel-btn { font-size:16px; }
    .custom-row { display:grid; grid-template-columns:1fr 1.65fr 1fr; gap:14px; margin-top:10px; }
    .custom-input { width:100%; min-width:0; min-height:42px; border:1px solid #4b5661; border-radius:999px; padding:0 12px; text-align:center; color:#fff; background:linear-gradient(180deg,#303843,#252a31); box-shadow:inset 0 1px rgba(255,255,255,.12),inset 0 -3px 7px rgba(0,0,0,.18),0 3px 7px rgba(0,0,0,.28); }
    .custom-input::placeholder { color:#e7edf2; opacity:1; }
    .time-input-group { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:5px; min-width:0; }
    .time-input-group span { color:#cbd3da; font-family:Bauhaus,"Arial Black",sans-serif; font-size:22px; }
    .time-input-group .custom-input { padding:0 7px; }
    .compact-label { font-size:10px; line-height:1.05; padding:3px 8px; }
    .interval-panel { display:none; }
    .interval-panel.show { display:block; }
    .settings-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .setting { text-align:center; padding:10px 6px; border:1px solid #3b4650; border-radius:13px; background:#101419; }
    .setting label { display:block; color:#929da7; font-size:10px; font-weight:900; letter-spacing:1.3px; text-transform:uppercase; }
    .stepper { display:grid; grid-template-columns:32px 1fr 32px; align-items:center; gap:2px; margin-top:7px; }
    .stepper button { height:32px; border:1px solid #45515c; border-radius:9px; color:#dfe6eb; background:#242b33; font-size:18px; font-weight:900; }
    .stepper output { font-family:Bauhaus,"Arial Black",sans-serif; font-size:24px; }
    .main-controls { display:grid; grid-template-columns:1fr 1.7fr 1fr; gap:9px; margin-top:12px; }
    .main-btn { border-radius:15px; min-height:58px; border:1px solid #4d5964; color:#cbd3da; font-weight:900; letter-spacing:.5px; background:linear-gradient(180deg,#303943,#171c22); box-shadow:inset 0 1px rgba(255,255,255,.12),0 8px 16px rgba(0,0,0,.35); }
    .main-btn.primary { color:var(--selected-text); border-color:var(--accent-light); background:linear-gradient(180deg,var(--accent-light),var(--accent-dark)); font-size:18px; box-shadow:0 3px 0 #303a32,0 0 0 1px rgba(199,206,211,.24),0 0 16px rgba(199,206,211,.10),inset 0 1px rgba(255,255,255,.38),0 8px 16px rgba(0,0,0,.4); }
    .main-btn:active { transform:translateY(1px); }
    .main-btn:disabled { opacity:.35; }
    .options { display:flex; justify-content:center; gap:18px; margin-top:13px; color:#a5afb8; font-size:12px; }
    .toggle { display:flex; align-items:center; gap:7px; }
    .toggle input { width:18px; height:18px; accent-color:var(--green); }

    .theme-bar { display:flex; align-items:center; justify-content:center; gap:10px; margin-top:12px; color:#a5afb8; font-size:12px; }
    .theme-label { font-weight:800; letter-spacing:.5px; }
    .theme-select { min-width:184px; min-height:40px; border:1px solid #4b5661; border-radius:999px; padding:0 15px; color:#eef3f6; background:linear-gradient(180deg,#303843,#252a31); box-shadow:inset 0 1px rgba(255,255,255,.12),inset 0 -3px 7px rgba(0,0,0,.18),0 3px 7px rgba(0,0,0,.28); }
    .theme-select:focus { outline:none; border-color:var(--accent-light); box-shadow:0 0 0 4px rgba(var(--accent-rgb),.16),inset 0 1px rgba(255,255,255,.12),0 3px 7px rgba(0,0,0,.28); }
    body.theme-blackout-silver .mode-tab.active,
    body.theme-blackout-silver .steel-btn.selected,
    body.theme-blackout-silver .main-btn.primary { color:#f1f3f4; background:linear-gradient(180deg,#181b1e,#050607); border-color:#aeb6bd; box-shadow:0 2px 0 #000,0 0 0 1px rgba(210,218,224,.18),inset 0 1px rgba(255,255,255,.09),0 6px 14px rgba(0,0,0,.55); }
    body.theme-blackout-silver .dial { background:conic-gradient(#aeb6bd var(--progress),#171a1d 0); }
    body.theme-blackout .mode-tab.active,
    body.theme-blackout .steel-btn.selected,
    body.theme-blackout .main-btn.primary { color:#d6d9dc; background:linear-gradient(180deg,#101214,#020303); border-color:#24282c; box-shadow:0 2px 0 #000,inset 0 1px rgba(255,255,255,.035),0 7px 16px rgba(0,0,0,.68); }
    body.theme-blackout .dial { background:conic-gradient(#25292c var(--progress),#070809 0); box-shadow:0 0 0 2px #191c1f,0 5px 0 #050606,inset 0 0 22px #000; }
    body.theme-blackout .phase, body.theme-blackout .logo { color:#73787d; }
    .finished .stage { animation:finishFlash .7s ease-in-out 4; }
    .warning { --accent:var(--amber); }
    .resting { --accent:var(--rest); }
    .finished { --accent:var(--red); }
    @keyframes countdownPulse { 0% { opacity:0; transform:scale(.96); } 18% { opacity:1; transform:scale(1); } 100% { opacity:0; transform:scale(1.025); } }
    @keyframes finishInnerPulse { 0%,100% { opacity:.28; } 50% { opacity:1; } }
    @keyframes finishFlash { 50% { filter:brightness(1.28); box-shadow:0 0 0 2px rgba(199,206,211,.18),0 0 38px rgba(168,95,98,.28); } }
    /* Compact phone layout: keeps the entire quick timer visible without crowding it. */
    @media (max-width:430px) {
      body { padding-top:calc(10px + env(safe-area-inset-top)); padding-left:14px; padding-right:14px; }
      .brand { margin-bottom:9px; }
      .logo { font-size:clamp(29px,8vw,38px); }
      .mode-tabs { gap:6px; padding:5px; border-radius:15px; }
      .mode-tab { padding:9px 7px; }
      .stage { margin:10px 0; padding:12px 14px 11px; border-radius:23px; }
      .phase { font-size:12px; min-height:16px; letter-spacing:2.6px; }
      .dial { --size:min(63vw,270px); margin:5px auto 2px; padding:10px; }
      .time { font-size:clamp(58px,17vw,82px); }
      .status { margin-top:5px; }
      .lead-indicator { margin-top:5px; font-size:14px; }
      .panel { margin-bottom:9px; padding:11px 13px; border-radius:16px; }
      .panel-title { margin-bottom:8px; }
      .preset-grid { gap:7px 12px; padding:0 6px; }
      .steel-btn { min-height:44px; }
      .adjust-row, .custom-row { margin-top:7px; gap:7px; }
      .custom-input { min-height:44px; }
      .main-controls { margin-top:9px; gap:8px; }
      .main-btn { min-height:54px; }
      .options { margin-top:10px; }
      .theme-bar { margin-top:9px; gap:8px; }
      .theme-select { min-width:170px; min-height:38px; }
    }
    /* Only compress genuinely small phones. Do not key this layout to height alone:
       iOS Safari changes viewport height as browser chrome appears/disappears. */
    @media (max-width:390px) {
      .brand { display:flex; margin:0 3px 7px; align-items:center; }
      .logo { font-size:28px; line-height:.86; }
      .tag { font-size:9px; letter-spacing:1.6px; padding-bottom:0; }
      .dial { --size:min(55vw,230px); }
      .stage { padding:10px 12px; }
      .panel { padding:10px 12px; }
      .steel-btn { min-height:41px; }
      .main-btn { min-height:49px; }
    }

    }
    remainingMs=Math.max(0,targetTime-Date.now()); const shown=Math.ceil(remainingMs/1000);
    if(shown!==lastShown){ lastShown=shown; if(shown>0&&shown<=5){ flashCountdown(); if(audioHealthy()){tone(610+shown*55,.16,.46); tone(915+shown*45,.12,.22,.015);}else{playFallback('beep');recoverAudio();} } }
    render(); if(remainingMs<=0) completePhase();
  }
  function startTicker(withLead=false){
    clearInterval(ticker); lastShown=null;
    if(withLead){ state='lead-in'; leadRemainingMs=5000; targetTime=Date.now()+5000; }
    else { state='running'; targetTime=Date.now()+remainingMs; }
    ticker=setInterval(tick,100);tick();requestWake();
  }
  function stopTicker(){ clearInterval(ticker);ticker=null;releaseWake(); }
  function start(){
    activateAudio();app.classList.remove('finished');
    if(state==='finished') reset();
    if(remainingMs<=0) reset();
    const freshStart=state==='ready';
    if(freshStart&&$('#voiceToggle').checked){
      if(leadInEnabled) speak('Get ready');
      else if(mode==='interval') speak(`Work. Round ${currentRound}`);
      else speak('Go');
    }
    startTicker(leadInEnabled&&freshStart); render();
  }
  function cancelLead(){ stopTicker(); leadRemainingMs=0; state='ready'; lastShown=null; render(); }
  function pause(){ remainingMs=Math.max(0,targetTime-Date.now());stopTicker();state='paused';render(); }
  function completePhase(){ stopTicker(); if(mode==='quick'){ finish();return; } if(phase==='work'&&values.rest>0){ setPhase('rest');state='running';startTicker();return; } if(phase==='rest'||values.rest===0){ if(currentRound<values.rounds){currentRound++;setPhase('work');state='running';startTicker();}else finish(); } }
  function finish(){ remainingMs=0;state='finished';boxingBell();speak('Workout complete');if(navigator.vibrate)navigator.vibrate([220,90,220,90,420]);render();setTimeout(()=>app.classList.remove('finished'),3600); }
  function reset(){ stopTicker();state='ready';currentRound=1;phase='work'; if(mode==='quick'){remainingMs=durationMs=selectedSeconds*1000;}else{remainingMs=durationMs=values.work*1000;} leadRemainingMs=0;lastShown=null;render(); }
  function skip(){ if(mode==='interval'&&state!=='ready'&&state!=='finished'){remainingMs=0;completePhase();} }

  startBtn.onclick=()=>{activateAudio();primeFallbackAudio();state==='lead-in'?cancelLead():state==='running'?pause():start();}; resetBtn.onclick=reset; skipBtn.onclick=()=>{activateAudio();skip();};
  $$('.mode-tab').forEach(b=>b.onclick=()=>{ mode=b.dataset.mode;document.body.classList.toggle('mode-quick',mode==='quick');document.body.classList.toggle('mode-interval',mode==='interval'); $$('.mode-tab').forEach(x=>x.classList.toggle('active',x===b));quickPanel.style.display=mode==='quick'?'block':'none';intervalPanel.classList.toggle('show',mode==='interval');roundStrip.classList.toggle('show',mode==='interval');reset();normalizeQuickScroll(); });
  $$('.preset-grid .steel-btn').forEach(b=>b.onclick=()=>setQuick(+b.dataset.seconds));
  $('#plusBtn').onclick=()=>{selectedSeconds=Math.ceil(remainingMs/1000)+5;remainingMs+=5000;durationMs=Math.max(durationMs,remainingMs);render();};
  $('#minusBtn').onclick=()=>{remainingMs=Math.max(5000,remainingMs-5000);selectedSeconds=Math.ceil(remainingMs/1000);durationMs=Math.max(remainingMs,selectedSeconds*1000);render();};
  $('#restartBtn').onclick=()=>setQuick(selectedSeconds);
  function customSet(){const m=Math.max(0,+$('#customMinutes').value||0),s=Math.max(0,+$('#customSeconds').value||0);const total=m*60+s;if(total>=1){setQuick(total);$('#customMinutes').value='';$('#customSeconds').value='';}}
  $('#customSetBtn').onclick=customSet;[$('#customMinutes'),$('#customSeconds')].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')customSet();}));
  $('#leadInBtn').onclick=()=>{leadInEnabled=!leadInEnabled;$('#leadInBtn').classList.toggle('selected',leadInEnabled);$('#leadInBtn').setAttribute('aria-pressed',String(leadInEnabled));render();};
  $$('[data-step]').forEach(b=>b.onclick=()=>{const k=b.dataset.step,d=+b.dataset.delta;values[k]=Math.max(k==='rounds'?1:k==='rest'?0:5,Math.min(k==='rounds'?50:3600,values[k]+d));$(`#${k}Value`).textContent=values[k];if(state==='ready')reset();});
  themeSelect?.addEventListener('change',e=>applyTheme(e.target.value));
  function rearmMedia(){
    recoverAudio();
    if('speechSynthesis'in window&&speechSynthesis.paused){
      try{speechSynthesis.resume();}catch(e){}
    }
  }
  /* Any real user touch is another chance to satisfy iOS's audio-gesture rule. */
  document.addEventListener('pointerdown',()=>{rearmMedia();primeFallbackAudio();},{capture:true,passive:true});
  window.addEventListener('pageshow',()=>{rearmMedia();normalizeQuickScroll();});
  window.addEventListener('focus',()=>{rearmMedia();normalizeQuickScroll();});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){recoverAudio(true);rearmMedia();if(state==='running'){tick();requestWake();}}});
  /* Prevent iOS pinch-gesture zoom without suppressing normal button taps. */
  ['gesturestart','gesturechange','gestureend'].forEach(type=>{
    document.addEventListener(type,e=>e.preventDefault(),{passive:false});
  });
  $('#soundToggle').addEventListener('change',e=>{if(e.target.checked){activateAudio();primeFallbackAudio();}});
  $('#voiceToggle').addEventListener('change',e=>{
    if(e.target.checked&&'speechSynthesis'in window){
      try{speechSynthesis.getVoices(); if(speechSynthesis.paused)speechSynthesis.resume();}catch(err){}
    }else if(!e.target.checked&&'speechSynthesis'in window){
      speechSeq++;
      clearTimeout(speechWatchdog);
      try{speechSynthesis.cancel();}catch(err){}
      speechUtterance=null;
    }
  });
  try{applyTheme(localStorage.getItem('billsTimerTheme')||'dustyGreen');}catch(e){applyTheme('dustyGreen');}
  document.body.classList.add('mode-quick');
  render();
  normalizeQuickScroll();
})();
</script>
</body>
</html>
